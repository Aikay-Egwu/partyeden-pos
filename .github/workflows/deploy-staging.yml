name: Deploy Staging (Plesk)

on:
  push:
    branches:
      - develop
      - staging
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  build-and-deploy:
    name: Build & Deploy to Plesk Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Run post-install Composer scripts
        run: |
          composer run-script post-autoload-dump
          composer run-script post-update-cmd || true

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deployment package (clean dev-only files)
        run: |
          rm -f .env
          rm -rf tests
          rm -rf database/database.sqlite

      - name: Deploy via SSH rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 22 }}
          SOURCE: "./"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: "-rlptzv --no-owner --no-group --omit-dir-times"
          EXCLUDE: ".env, storage/logs/*, storage/framework/cache/*, storage/framework/sessions/*, storage/framework/views/*, storage/pail/*, public/storage, .git, .github"
          #EXCLUDE: ".env, storage/logs/*, storage/framework/cache/*, storage/framework/sessions/*, storage/framework/views/*, storage/app/*, storage/pail/*, public/storage, .git, .github"
          SCRIPT_BEFORE: |
            whoami
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            # If Plesk or server git hooks expect origin references, fetch them before deploying
            if [ -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              cd ${{ secrets.DEPLOY_PATH }}
              git fetch origin staging || git fetch --all || true
            fi
          SCRIPT_AFTER: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            # 1. Ensure all Laravel storage and cache directories exist
            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs
            mkdir -p storage/app/public
            mkdir -p bootstrap/cache
            
            # 2. Fix general file and folder permissions
            find . -type d -exec chmod 755 {} +
            find . -type f -exec chmod 644 {} +
            
            # 3. Ensure storage and bootstrap/cache are fully writable by PHP-FPM (prevents 500 errors)
            chmod -R 777 storage bootstrap/cache
            
            # 4. If deploying as root, restore ownership to Plesk subscription user (:psacln / :psaserv)
            if [ "$(id -u)" -eq 0 ]; then
              TARGET_OWNER=$(stat -c '%U:%G' .. 2>/dev/null || stat -f '%Su:%Sg' .. 2>/dev/null || true)
              if [ -n "$TARGET_OWNER" ] && [ "$TARGET_OWNER" != "root:root" ]; then
                chown -R "$TARGET_OWNER" .
                chmod -R 777 storage bootstrap/cache
              fi
            fi
            
            # 5. Detect correct PHP CLI binary (Plesk default CLI is often old PHP; use Plesk PHP 8.x if available)
            if [ -x "/opt/plesk/php/8.4/bin/php" ]; then
              PHP_BIN="/opt/plesk/php/8.4/bin/php"
            elif [ -x "/opt/plesk/php/8.3/bin/php" ]; then
              PHP_BIN="/opt/plesk/php/8.3/bin/php"
            elif [ -x "/opt/plesk/php/8.2/bin/php" ]; then
              PHP_BIN="/opt/plesk/php/8.2/bin/php"
            else
              PHP_BIN="php"
            fi
            
            # 6. Run Laravel post-deployment commands
            $PHP_BIN artisan config:clear --no-ansi || true
            $PHP_BIN artisan cache:clear --no-ansi || true
            $PHP_BIN artisan view:clear --no-ansi || true
            $PHP_BIN artisan config:cache --no-ansi
            $PHP_BIN artisan route:cache --no-ansi || true
            $PHP_BIN artisan view:cache --no-ansi || true
            $PHP_BIN artisan migrate --force --no-ansi
            
            # 7. Create storage symlink if missing
            if [ ! -L public/storage ]; then
              $PHP_BIN artisan storage:link --no-ansi || true
            fi
            
            echo "Deployment complete."