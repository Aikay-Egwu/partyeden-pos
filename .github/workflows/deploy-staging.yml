name: Deploy Staging (Plesk)

on:
  push:
    branches:
      - develop
      - staging
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  build-and-deploy:
    name: Build & Deploy to Plesk Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Run post-install Composer scripts
        run: |
          composer run-script post-autoload-dump
          composer run-script post-update-cmd || true

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deployment package (clean dev-only files)
        run: |
          rm -f .env
          rm -rf tests
          rm -rf database/database.sqlite

      - name: Deploy via SSH rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 22 }}
          SOURCE: "./"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          EXCLUDE: ".env, .htaccess, storage/logs/*, storage/framework/cache/*, storage/framework/sessions/*, storage/framework/views/*, storage/app/*, storage/pail/*, public/storage, vendor/.htaccess, .git, .github"
          SCRIPT_BEFORE: |
            whoami
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            # If Plesk or server git hooks expect origin references, fetch them before deploying
            if [ -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              cd ${{ secrets.DEPLOY_PATH }}
              git fetch origin staging || git fetch --all || true
            fi
          SCRIPT_AFTER: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Ensure permissions for storage and cache
            chmod -R 755 storage bootstrap/cache
            
            # Run Laravel post-deployment commands
            php artisan config:cache --no-ansi
            php artisan route:cache --no-ansi || true
            php artisan view:cache --no-ansi || true
            php artisan migrate --force --no-ansi
            
            # Create storage symlink if missing
            if [ ! -L public/storage ]; then
              php artisan storage:link --no-ansi
            fi
            
            echo "Deployment complete."