name: Deploy Partyeden to Staging

# Trigger this workflow whenever code is pushed to the staging branch
on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Links to the "staging" environment in GitHub (for environment-specific secrets and protection rules)
    environment: staging

    steps:
      # Connect to the staging server over SSH and run the deployment script
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          # Pass the GitHub deploy key into the SSH session so we can write it to a temp file on the server
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Exit immediately if any command fails
            set -e

            # Write the deploy key to a temporary file for Git SSH operations
            DEPLOY_KEY_FILE=$(mktemp)
            echo "$DEPLOY_KEY" > "$DEPLOY_KEY_FILE"
            chmod 600 "$DEPLOY_KEY_FILE"

            # Clean up the temp key file when the script exits (success or failure)
            trap "rm -f $DEPLOY_KEY_FILE" EXIT

            # Ensure the deploy directory exists, then move into it
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}

            # Mark this directory as safe for Git (prevents "dubious ownership" errors on shared servers)
            git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$(pwd)" || git config --global --add safe.directory "$(pwd)"

            # Use the temp deploy key for Git SSH operations, and trust GitHub's host key
            export GIT_SSH_COMMAND="ssh -i $DEPLOY_KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

            # Pull the latest code — either fetch if repo exists, or clone fresh on first deploy
            if [ -d .git ]; then
              echo "==> Pulling latest staging code"
              git fetch --all
              git reset --hard origin/staging
            else
              echo "==> No git repo found — cloning staging for the first time"
              cd ..
              rm -rf "$(basename "${{ secrets.DEPLOY_PATH }}")"
              git clone --branch staging --single-branch git@github.com:${{ github.repository }}.git "$(basename "${{ secrets.DEPLOY_PATH }}")"
              cd "${{ secrets.DEPLOY_PATH }}"
            fi

            # Install PHP dependencies (production only, optimized autoloader for performance)
            echo "==> Installing PHP dependencies"
            composer install --no-dev --optimize-autoloader --no-interaction

            # Install Node.js dependencies (exact versions from package-lock.json)
            echo "==> Installing frontend dependencies"
            npm ci

            # Build frontend assets (JavaScript, CSS) and the Inertia SSR bundle
            # The SSR port is read from .env so the server-side renderer binds to the right port
            echo "==> Building assets (client + SSR), mirroring Plesk's own build step"
            export INERTIA_SSR_PORT=$(grep -oP '(?<=^INERTIA_SSR_PORT=).*' .env || true)
            rm -rf public/hot
            npm run build:ssr

            # Apply any pending database migrations (safe for production with --force)
            echo "==> Running database migrations"
            php artisan migrate --force

            # Rebuild Laravel's caches so the app uses the latest config, routes, and views
            echo "==> Refreshing caches"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            # Ensure the storage symlink exists (links public/storage to storage/app/public)
            php artisan storage:link || true

            # Stop the Inertia SSR process — Supervisor will automatically restart it with the new code
            echo "==> Restarting the Inertia SSR process (Supervisor auto-restarts it)"
            php artisan inertia:stop-ssr || true

            # Signal queue workers to gracefully restart so they pick up the new code
            echo "==> Restarting queue workers so they pick up new code"
            php artisan queue:restart || true

      # Quick health check — hit the staging URL and fail the deploy if it returns a 5xx error
      - name: Smoke test
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }})
          if [ "$STATUS" -ge 500 ]; then
            echo "Staging returned HTTP $STATUS after deploy!" && exit 1
          fi
          echo "Staging responded with HTTP $STATUS"
