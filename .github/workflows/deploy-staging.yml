name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> Trusting this directory for Git (avoids 'dubious ownership' errors)"
            git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$(pwd)" || git config --global --add safe.directory "$(pwd)"

            echo "==> Pulling latest staging code"
            export GIT_SSH_COMMAND="ssh -i /var/www/vhosts/partyeden.co.uk/staging-files/.ssh/github_deploy_key -o IdentitiesOnly=yes"
            git fetch --all
            git reset --hard origin/staging

            echo "==> Installing PHP dependencies"
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "==> Installing frontend dependencies"
            npm ci

            echo "==> Building assets (client + SSR), mirroring Plesk's own build step"
            export INERTIA_SSR_PORT=$(grep -oP '(?<=^INERTIA_SSR_PORT=).*' .env || true)
            rm -rf public/hot
            npm run build:ssr

            echo "==> Running database migrations"
            php artisan migrate --force

            echo "==> Refreshing caches"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true

            echo "==> Restarting the Inertia SSR process (Supervisor auto-restarts it)"
            php artisan inertia:stop-ssr || true

            echo "==> Restarting queue workers so they pick up new code"
            php artisan queue:restart || true

      - name: Smoke test
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }})
          if [ "$STATUS" -ge 500 ]; then
            echo "Staging returned HTTP $STATUS after deploy!" && exit 1
          fi
          echo "Staging responded with HTTP $STATUS"
