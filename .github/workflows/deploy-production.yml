name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # <-- pauses here for manual approval

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> Loading Node/npm into PATH (non-login SSH shells don't source ~/.bashrc)"
            # Source NVM if installed per-user (most common on Plesk)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            # Also add common system-wide Node install locations as a fallback
            export PATH="$PATH:/usr/local/bin:/usr/bin"

            echo "==> Safety net: no matter what fails below, always try to bring the site back up on exit"
            trap 'php artisan up || true' EXIT

            echo "==> Trusting this directory for Git (avoids 'dubious ownership' errors)"
            git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$(pwd)" || git config --global --add safe.directory "$(pwd)"

            echo "==> Backing up the database before touching anything"
            mkdir -p storage/backups
            # Parse .env values safely: split on first '=' (handles '=' in values),
            # then strip surrounding quotes. Avoids bash expansion that `source .env` would trigger.
            DB_USER=$(grep '^DB_USERNAME=' .env | head -n1 | cut -d'=' -f2- | tr -d '"' | tr -d "'")
            DB_PASS=$(grep '^DB_PASSWORD=' .env | head -n1 | cut -d'=' -f2- | tr -d '"' | tr -d "'")
            DB_NAME=$(grep '^DB_DATABASE=' .env | head -n1 | cut -d'=' -f2- | tr -d '"' | tr -d "'")
            DB_HOST=$(grep '^DB_HOST=' .env | head -n1 | cut -d'=' -f2- | tr -d '"' | tr -d "'")
            # Connect using the same host Laravel uses. Without -h, mysqldump defaults to the
            # localhost socket, but 'user'@'localhost' and 'user'@'127.0.0.1' are separate
            # MySQL accounts that can have different passwords/grants.
            MYSQL_PWD="$DB_PASS" mysqldump --single-transaction -h "${DB_HOST:-localhost}" -u "$DB_USER" "$DB_NAME" > storage/backups/pre-deploy-$(date +%Y%m%d%H%M%S).sql 2>/dev/null || true

            echo "==> Putting the site into maintenance mode"
            php artisan down --retry=15 || true

            echo "==> Pulling latest production code"
            export GIT_SSH_COMMAND="ssh -i ${{ secrets.PLESK_DEPLOY_PATH }} -o IdentitiesOnly=yes"
            # The deploy directory may not contain a .git folder (e.g. files were uploaded
            # via Plesk/FTP without repo metadata). Initialize a repo and point it at GitHub.
            if [ ! -d .git ]; then
              echo "==> .git not found in deploy path; initializing repository"
              git init
              git remote add origin "git@github.com:${{ github.repository }}.git"
            fi
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing PHP dependencies"
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "==> Installing frontend dependencies"
            npm ci

            echo "==> Building assets (client + SSR), mirroring Plesk's own build step"
            export INERTIA_SSR_PORT=$(grep -oP '(?<=^INERTIA_SSR_PORT=).*' .env || true)
            rm -rf public/hot
            npm run build:ssr

            echo "==> Running database migrations"
            php artisan migrate --force

            echo "==> Refreshing caches"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true

            echo "==> Restarting the Inertia SSR process (Supervisor auto-restarts it)"
            php artisan inertia:stop-ssr || true

            echo "==> Restarting queue workers"
            php artisan queue:restart || true

            echo "==> Fixing file ownership so Apache/Plesk web user can read and write files"
            # WEB_USER is the Plesk subscription username (e.g. partyedencom).
            # Apache runs as this user, so root-owned files cause 403s and DB write failures.
            chown -R ${{ secrets.WEB_USER }}:${{ secrets.WEB_GROUP }} .

            echo "==> Setting correct permissions"
            # Directories: 755 for general files (excluding .git and node_modules)
            find . -not -path './.git/*' -not -path './node_modules/*' -type d -exec chmod 755 {} \;
            # Files: 644 for general files (excluding .git and node_modules)
            find . -not -path './.git/*' -not -path './node_modules/*' -type f -exec chmod 644 {} \;
            # Ensure binaries in node_modules/.bin remain executable
            chmod -R +x node_modules/.bin || true
            # Writable directories needed by Laravel at runtime
            chmod -R 775 storage bootstrap/cache
            # artisan must be executable
            chmod 755 artisan

            echo "==> Bringing the site back up"
            php artisan up

      - name: Smoke test
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }})
          if [ "$STATUS" -ge 500 ]; then
            echo "Production returned HTTP $STATUS after deploy!" && exit 1
          fi
          echo "Production responded with HTTP $STATUS"